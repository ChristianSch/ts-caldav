name: Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      radicale:
        image: tomsquest/docker-radicale:latest
        ports:
          - 5232:5232

    env:
      CALDAV_BASE_URL: http://localhost:5232
      CALDAV_USERNAME: test
      CALDAV_PASSWORD: test123

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Setup Radicale user and calendar
        run: |
          # Wait for Radicale to start
          sleep 3
          # Create user (Radicale auto-creates on first auth with default config)
          # Create a calendar
          curl -u test:test123 -X MKCALENDAR http://localhost:5232/test/calendar/ || true

      - name: Run tests
        run: |
          npx jest tests/client.test.ts \
                   tests/recurrence.test.ts \
                   tests/timezone.test.ts \
                   tests/alarms.test.ts \
                   tests/description-encoding.test.ts \
                   tests/cache.test.ts \
                   tests/todos.test.ts
